<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dataset Map Viewer</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
      }

      header {
        padding: 1rem;
        border-bottom: 1px solid #ddd;
      }

      #map {
        height: calc(100vh - 110px);
        width: 100%;
      }

      .status {
        font-size: 0.95rem;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <header>
      <label for="dataset">Upload GeoJSON dataset:</label>
      <input id="dataset" type="file" accept=".json,.geojson,application/json" />
      <div id="status" class="status">Choose a GeoJSON file to render it on the map.</div>
    </header>
    <main>
      <div id="map"></div>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const map = L.map("map").setView([20, 0], 2);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      const status = document.getElementById("status");
      const fileInput = document.getElementById("dataset");
      let activeLayer;

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.style.color = isError ? "#b00020" : "#222";
      }

      fileInput.addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;

        try {
          const text = await file.text();
          const data = JSON.parse(text);

          if (activeLayer) {
            map.removeLayer(activeLayer);
          }

          activeLayer = L.geoJSON(data).addTo(map);
          const bounds = activeLayer.getBounds();

          if (bounds.isValid()) {
            map.fitBounds(bounds.pad(0.1));
          }

          setStatus(`Loaded ${file.name} successfully.`);
        } catch (error) {
          setStatus(
            `Could not load ${file.name}. Please upload a valid GeoJSON file.`,
            true
          );
        }
      });
    </script>
  </body>
</html>
